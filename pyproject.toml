[project]
name = "shortcake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrick Arminio", email = "patrick.arminio@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.15.0",
    "dulwich[merge]>=1.0.0",
    "pygit2>=1.19.1",
    "rich-toolkit>=0.12.0",
    "pydantic>=2.0.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[dependency-groups]
typing = ["ty>=0.0.1"]
linting = ["ruff>=0.11.0"]
dev = [
    "inline-snapshot>=0.31.1",
    "pytest-benchmark>=5.2.3",
    "pytest-playwright>=0.6.0",
    "respx>=0.22.0",
]

[project.scripts]
shortcake = "shortcake.cli:app"
sc = "shortcake.cli:app"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.ty.rules]
# Ignore due to dulwich's incomplete type annotations
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
unsupported-operator = "ignore"

[tool.pytest.ini_options]
markers = ["e2e: end-to-end browser tests (requires playwright)"]

[tool.ruff]
target-version = "py313"  # ruff doesn't support py314 yet
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"]  # Mutable class attributes in test mocks don't need ClassVar
