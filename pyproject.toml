[project]
name = "shortcake"
version = "0.1.0"
description = "A CLI built with typer and uv"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
]

[project.scripts]
shortcake = "shortcake.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "inline-snapshot>=0.13.0",
]
